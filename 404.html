<script>
window.addEventListener('DOMContentLoaded', function() {
  // Парсим текущий путь
  const path = window.location.pathname;
  
  // Если не главная страница и не файл/папка
  if (path !== '/' && !path.match(/\.(css|png|jpg|jpeg|gif|ico|svg)$/)) {
    // Перенаправляем на главную с хэшем или используем History API
    window.history.replaceState({}, '', '/#' + path.slice(1));
    // Или используйте pushState для чистых URL
    // window.history.pushState({}, '', '/');
  }
  
  // Обработка History API для SPA
  window.addEventListener('popstate', function() {
    location.reload(); // Простое решение для GitHub Pages
  });
});
</script>
